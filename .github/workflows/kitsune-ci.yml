name: KITSUNEnime CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kitsune-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed so the version name can embed the git commit hash

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # API 37 is only published as a minor-versioned package (platforms;android-37.0);
      # "platforms;android-37" does not exist. compileSdk = 37 maps to android-37.0.
      # GitHub runners do not ship this bleeding-edge platform yet, so install it explicitly.
      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build Google debug APK
        run: ./gradlew assembleGoogleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kitsunenime-google-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
